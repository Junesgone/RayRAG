apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rayrag.fullname" . }}
  labels:
    {{- include "rayrag.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rayrag.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rayrag.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: rayrag
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rayrag.fullname" . }}-config
          env:
            - name: RAYRAG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rayrag.fullname" . }}
                  key: rayrag-admin-password
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/v1/system/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/system/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: rayrag-state
              mountPath: /app/web
            - name: rayrag-zvec
              mountPath: /var/lib/rayrag/zvec
      volumes:
        - name: rayrag-state
          emptyDir: {}
        - name: rayrag-zvec
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
