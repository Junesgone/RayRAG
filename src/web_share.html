<div class='share-wrap'><div class='share-head'><div class='av' id='shareAv' style='width:44px;height:44px;font-size:18px'>🤖</div><div><h2 id='shareTitle' style='margin:0;font-size:17px'>…</h2><p id='shareSub' style='margin:2px 0 0;color:var(--tm);font-size:12px'>RayRAG shared chat</p></div></div><div id='shareMsgs' class='share-msgs'></div><div class='share-in'><textarea id='shareInput' rows='2' placeholder='__PH__' style='width:100%;box-sizing:border-box'></textarea><button class='btn btn-p' id='shareSend' onclick='shareSend()' style='margin-top:8px'>__SEND__→</button></div></div>
<style>.share-wrap{max-width:860px;margin:24px auto;padding:0 16px;display:flex;flex-direction:column;min-height:78vh}.share-head{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--bd);border-radius:14px}.share-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.share-in{padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px}.smsg{max-width:82%;padding:10px 14px;border-radius:12px;line-height:1.55;font-size:14px;white-space:pre-wrap;word-break:break-word}.smsg.u{align-self:flex-end;background:var(--p);color:#fff}.smsg.a{align-self:flex-start;background:var(--bgc);border:1px solid var(--bd)}.srefs{margin-top:6px;font-size:11px;color:var(--tm)}</style>
<script>
var sid=(location.search.match(/shared_id=([^&]+)/)||[])[1]||'';
var from=((location.search.match(/^.*from=([^&]+)/,location.search)||[])[1])||'chatbots';
var base=from==='agentbots'?'/api/v1/agentbots/':'/api/v1/chatbots/';
var msgsEl=document.getElementById('shareMsgs');
function esc(x){var d=document.createElement('div');d.textContent=x;return d.innerHTML}
function add(role,text){var el=document.createElement('div');el.className='smsg '+(role==='user'?'u':'a');el.innerHTML=text;msgsEl.appendChild(el);msgsEl.scrollTop=msgsEl.scrollHeight}
fetch(base+sid+'/info').then(function(r){return r.json()}).then(function(d){var info=d.data||{};document.getElementById('shareTitle').textContent=info.title||'Shared Chat';var av=document.getElementById('shareAv');if(info.avatar){av.textContent='';var img=document.createElement('img');img.src=info.avatar;img.style.cssText='width:44px;height:44px;border-radius:10px;object-fit:cover';av.appendChild(img)}if(info.prologue){add('assistant',esc(info.prologue))}}).catch(function(){document.getElementById('shareTitle').textContent='Shared Chat'});
function shareSend(){var q=document.getElementById('shareInput').value.trim();if(!q)return;add('user',esc(q));document.getElementById('shareInput').value='';var el=document.createElement('div');el.className='smsg a';el.innerHTML='<span style=color:var(--tm)>…</span>';msgsEl.appendChild(el);msgsEl.scrollTop=msgsEl.scrollHeight;var acc='';var refs=[];var ac=new AbortController();fetch(base+sid+'/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,stream:true,from:from}),signal:ac.signal}).then(function(r){var rd=r.body.getReader();var dec=new TextDecoder();var buf='';return (function pump(){return rd.read().then(function(x){if(x.done){el.innerHTML=esc(acc||'(empty)')+(refs.length?'<div class=srefs>📎 '+refs.length+' references</div>':'');return}buf+=dec.decode(x.value,{stream:true});var lines=buf.split('\n');buf=lines.pop();lines.forEach(function(ln){if(ln.indexOf('data:')!==0)return;var data=ln.slice(5).trim();if(data==='[DONE]')return;try{var ev=JSON.parse(data);if(ev.object==='chat.completion.references'){refs=ev.references||refs;return}var c=ev.choices&&ev.choices[0]&&ev.choices[0].delta&&ev.choices[0].delta.content||'';if(c){acc+=c;el.innerHTML=esc(acc)}}catch(e){}});return pump()})()}).catch(function(e){if(e&&e.name!=='AbortError')el.innerHTML='<span style=color:var(--err)>Error</span>'})}
</script>
